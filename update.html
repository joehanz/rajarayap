<script src="script.js"></script>

  <script>
  function generateSlug(text) {
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, "")
      .trim()
      .replace(/\s+/g, "-");
  }

  function createThumbnail(post) {
    const slug = generateSlug(post.title);
    let shortDesc = post.description;
    if (shortDesc.length > 250) {
      shortDesc = shortDesc.substring(0, 250) + "...";
    }
    return `
      <div style="padding:30px;background:#111;border-radius:20px">
        <h2>${post.title}</h2>
        <p>${shortDesc}</p>
        <a href="postingan-saya.html?slug=${slug}">Baca lagi</a>
      </div>
    `;
  }

  async function loadPosts() {
    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbzapZ2eOZ6js8EUxyaTgphq0EnVS7Yw66-aW30yuuDwG4bYQhQWJCHzLpTXkUOch1VN/exec?action=getPosts");
      const posts = await response.json();
      const container = document.getElementById("postsContainer");
      container.innerHTML = posts.map(createThumbnail).join("");
    } catch (err) {
      console.error("Gagal load postingan:", err);
    }
  }

  loadPosts();
  </script>
