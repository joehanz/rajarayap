<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | RAJA RAYAP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 font-poppins">
<section class="max-w-xl mx-auto mt-20 p-6 bg-white shadow-lg rounded-lg">
  <h1 class="text-2xl font-bold mb-6">Form Posting Baru</h1>
  <form id="postForm" class="space-y-6">
    
    <!-- Judul -->
    <div>
      <label class="block mb-2 font-semibold">Judul</label>
      <input type="text" id="title" name="title" 
             class="w-full border p-2 rounded" required />
    </div>

    <!-- Upload Gambar -->
    <div>
      <label class="block mb-2 font-semibold">Upload Gambar</label>
      <input type="file" id="image" name="image" 
             accept="image/*" class="w-full border p-2 rounded" required />
    </div>

    <!-- Deskripsi -->
    <div>
      <label class="block mb-2 font-semibold">Deskripsi</label>
      <textarea id="description" name="description" rows="5" 
                class="w-full border p-2 rounded" required></textarea>
    </div>

    <!-- Tombol Kirim -->
    <div class="text-right">
      <button type="submit" 
              class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
        Kirim
      </button>
    </div>
  </form>
</section>

  <script src="script.js"></script>
</body>
</html>
