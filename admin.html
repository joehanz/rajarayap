<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin | RAJA RAYAP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 font-poppins">

  <section class="max-w-xl mx-auto mt-20 p-6 bg-white shadow-lg rounded-lg">
    <h1 class="text-2xl font-bold mb-4">Form Posting Baru</h1>
    <form id="postForm">
      <!-- Judul -->
      <label class="block mb-2 font-semibold">Judul</label>
      <input type="text" id="title" name="title" class="w-full border p-2 mb-4" required />

      <!-- Upload Gambar -->
      <label class="block mb-2 font-semibold">Upload Gambar</label>
      <input type="file" id="image" name="image" accept="image/*" class="w-full mb-4" required />

      <!-- Deskripsi -->
      <label class="block mb-2 font-semibold">Deskripsi</label>
      <textarea id="description" name="description" rows="5" class="w-full border p-2 mb-4" required></textarea>

      <!-- Tombol Kirim -->
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
        Kirim
      </button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
