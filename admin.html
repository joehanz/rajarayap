  </div>

<section class="intro py-32 text-center">
  <h1 class="text-5xl font-extrabold mb-8">
    Control Panel Admin
  </h1>

  <form id="postForm" class="max-w-xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6 text-black">
    <!-- Judul -->
    <div>
      <label for="title" class="block text-left font-semibold mb-2 text-black">Judul</label>
      <input type="text" id="title" name="title" required
        class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-300 text-black">
    </div>

    <!-- Deskripsi -->
    <div>
      <label for="description" class="block text-left font-semibold mb-2 text-black">Deskripsi (max 3000 karakter)</label>
      <textarea id="description" name="description" maxlength="3000" required
        class="w-full border rounded-lg px-4 py-2 h-40 focus:ring focus:ring-blue-300 text-black"></textarea>
      <p id="charCount" class="text-sm text-gray-600 mt-1 text-right">0/3000</p>
    </div>

    <!-- Upload Foto -->
    <div>
      <label for="image" class="block text-left font-semibold mb-2 text-black">Upload Foto</label>
      <input type="file" id="image" name="image" accept="image/*" required
        class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-300 text-black">
      <!-- Preview -->
      <img id="preview" class="mt-4 mx-auto max-h-64 rounded-lg shadow" alt="Preview gambar" style="display:none;">
    </div>

    <!-- Tombol -->
    <button type="submit"
      class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
      Kirim
    </button>
  </form>

  <!-- Tombol Lihat Postingan (hidden dulu) -->
  <button id="lihatPostingan"
    class="mt-6 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-semibold"
    style="display:none;">
    Lihat Postingan
  </button>
</section>

<script>
const descInput = document.getElementById("description");
const charCounter = document.getElementById("charCount");
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
const lihatPostinganBtn = document.getElementById("lihatPostingan");

descInput.addEventListener("input", () => {
  charCounter.textContent = `${descInput.value.length}/3000`;
});

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
  } else {
    preview.style.display = "none";
  }
});

// fungsi slug
function generateSlug(text) {
  return text
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-");
}

document.getElementById("postForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const desc = descInput.value.trim();
  const image = imageInput.files[0];

  if (!title || !desc || !image) {
    alert("Semua field wajib diisi!");
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    const base64Image = reader.result;

    const payload = {
      title: title,
      description: desc,
      image: base64Image
    };

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbzapZ2eOZ6js8EUxyaTgphq0EnVS7Yw66-aW30yuuDwG4bYQhQWJCHzLpTXkUOch1VN/exec", {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      if (result.status === "success") {
        alert("Postingan berhasil disimpan dengan ID: " + result.id);

        // bikin slug dari judul
        const slug = generateSlug(title);

        // update tombol agar link ke domain + slug
        lihatPostinganBtn.style.display = "inline-block";
        lihatPostinganBtn.onclick = () => {
          window.location.href = `https://rajarayap.com/postingan-saya.html?slug=${slug}`;
        };
      } else {
        alert("Error: " + result.message);
      }
    } catch(err){
      alert("Gagal kirim data: " + err);
    }
  };
  reader.readAsDataURL(image);
});
</script>
