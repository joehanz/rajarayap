<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Panel Admin | RAJA RAYAP</title>

<script>
// Proteksi: wajib login melalui popup index.html
if (sessionStorage.getItem("adminLogin") !== "true") {
    location.replace("index.html");
}
</script>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">RAJA RAYAP</a>
    <div class="desktop-menu">
      <button
        onclick="logout()"
        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold">
        Logout
    </button>
    </div>
    <div id="burger">☰</div>
  </div>

  <div class="mobile-menu" id="mobileMenu">
      <button
        onclick="logout()"
        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold">
        Logout
    </button>
  </div>
</nav>

<section class="intro" style="padding-top:120px;text-align:center">
    <h1 style="font-size:52px;font-weight:800;margin-bottom:30px;">
        Control Panel Admin
    </h1>

    <p class="mb-6">
        <form id="postForm">
  <label for="title">Judul:</label>
  <input type="text" id="title" name="title" required>

  <label for="description">Deskripsi (max 3000 karakter):</label>
  <textarea id="description" name="description" maxlength="3000" required></textarea>

  <label for="image">Upload Foto:</label>
  <input type="file" id="image" name="image" accept="image/*" required>

  <button type="submit">Kirim</button>
</form>

    </p>

    
</section>

<footer style="text-align:center;padding:40px 0">
© 2026 Raja Rayap
</footer>

<script src="script.js"></script>

<script>
function logout(){
    sessionStorage.removeItem("adminLogin");
    location.replace("index.html");
}

history.pushState(null,"",location.href);

window.addEventListener("popstate",function(){
    history.pushState(null,"",location.href);
});
</script>

</body>
</html>
