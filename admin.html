<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Panel Admin | RAJA RAYAP</title>

<script>
// Proteksi: wajib login melalui popup index.html
if (sessionStorage.getItem("adminLogin") !== "true") {
    location.replace("index.html");
}
</script>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">RAJA RAYAP</a>
    <div class="desktop-menu">
      <button
        onclick="logout()"
        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold">
        Logout
    </button>
    </div>
    <div id="burger">☰</div>
  </div>

  <div class="mobile-menu" id="mobileMenu">
      <button
        onclick="logout()"
        class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold">
        Logout
    </button>
  </div>
</nav>

<section class="intro py-32 text-center">
  <h1 class="text-5xl font-extrabold mb-8">
    Control Panel Admin
  </h1>

  <form id="postForm" class="max-w-xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6 text-black">
    <!-- Judul -->
    <div>
      <label for="title" class="block text-left font-semibold mb-2">Judul</label>
      <input type="text" id="title" name="title" required
        class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-300">
    </div>

    <!-- Deskripsi -->
    <div>
      <label for="description" class="block text-left font-semibold mb-2">Deskripsi (max 3000 karakter)</label>
      <textarea id="description" name="description" maxlength="3000" required
        class="w-full border rounded-lg px-4 py-2 h-40 focus:ring focus:ring-blue-300"></textarea>
      <p id="charCount" class="text-sm text-gray-500 mt-1 text-right">0/3000</p>
    </div>

    <!-- Upload Foto -->
    <div>
      <label for="image" class="block text-left font-semibold mb-2">Upload Foto</label>
      <input type="file" id="image" name="image" accept="image/*" required
        class="w-full border rounded-lg px-4 py-2 focus:ring focus:ring-blue-300">
    </div>

    <!-- Tombol -->
    <button type="submit"
      class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
      Kirim
    </button>
  </form>
</section>

<script>
const description = document.getElementById("description");
const charCount = document.getElementById("charCount");

description.addEventListener("input", () => {
  charCount.textContent = `${description.value.length}/3000`;
});

document.getElementById("postForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const desc = description.value.trim();
  const image = document.getElementById("image").files[0];

  if (!title) {
    alert("Judul wajib diisi!");
    return;
  }
  if (desc.length > 3000) {
    alert("Deskripsi maksimal 3000 karakter!");
    return;
  }
  if (!image) {
    alert("Upload foto wajib!");
    return;
  }

  alert("Form valid, siap kirim!");
});
</script>


<footer style="text-align:center;padding:40px 0">
© 2026 Raja Rayap
</footer>

<script src="script.js"></script>

<script>
function logout(){
    sessionStorage.removeItem("adminLogin");
    location.replace("index.html");
}

history.pushState(null,"",location.href);

window.addEventListener("popstate",function(){
    history.pushState(null,"",location.href);
});
</script>

</body>
</html>
