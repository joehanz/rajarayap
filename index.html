<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raja Rayap</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-poppins">

  <!-- HERO -->
  <section class="relative flex flex-col items-center justify-center min-h-screen text-center px-6">
    <!-- Background gambar + overlay -->
    <div class="absolute inset-0">
      <img style="height:100%;width:100%;top:0px;border:none;display:cover;" src="https://raw.githubusercontent.com/joehanz/rajarayap/refs/heads/main/images/imageedit_2_4309366670.png" 
           alt="Teknisi Raja Rayap" />
      <div class="absolute inset-0 bg-gradient-to-b from-green-700/30 to-teal-700/30"></div>
    </div>

    <!-- Konten -->
    <div class="relative z-10">
      <img src="images/rajarayap.icon.webp" alt="Logo Raja Rayap" class="w-24 h-24 mx-auto mb-4" />
      <h1 class="text-4xl md:text-5xl font-bold mb-2">RAJA RAYAP</h1>
      <p class="max-w-xl mx-auto mb-6 text-sm md:text-base leading-relaxed">
        Jakarta – Tangerang – Serang – Bandung – Tasikmalaya – Garut – 
        Cirebon – Majalengka – Sumedang – Subang – Indramayu
      </p>
      <div class="flex flex-col md:flex-row gap-4 justify-center">
        <a href="update.html" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold">Visitor</a>
        <a href="javascript:void(0)" onclick="openPopup()" class="bg-gray-600 hover:bg-gray-700 px-6 py-3 rounded-lg font-semibold">Admin</a>
      </div>
    </div>
  </section>

  <!-- POPUP LOGIN -->
<div id="loginPopup" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
  <div class="bg-gray-800 rounded-lg shadow-lg p-6 w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login Admin</h2>
    <form id="loginForm" class="space-y-4">
      <!-- Email / Telpon -->
      <input type="text" id="username" name="username" placeholder="Email / Telpon"
             class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" required>
      <!-- Password -->
      <input type="password" id="password" name="password" placeholder="Password"
             class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" required>
      <!-- Tombol -->
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded font-semibold">
        Login
      </button>
      <button type="button" onclick="closePopup()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded font-semibold">
        Batal
      </button>
    </form>
  </div>
</div>

<script>
  function openPopup() {
    document.getElementById("loginPopup").classList.remove("hidden");
    document.getElementById("loginPopup").classList.add("flex");
  }

  function closePopup() {
    document.getElementById("loginPopup").classList.add("hidden");
    document.getElementById("loginPopup").classList.remove("flex");
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);

      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbzapZ2eOZ6js8EUxyaTgphq0EnVS7Yw66-aW30yuuDwG4bYQhQWJCHzLpTXkUOch1VN/exec",
        {
          method: "POST",
          body: formData
        }
      );

      const result = await response.json();

      console.log("Login Result:", result);

      if (result.success === true) {

        // Simpan session login
        sessionStorage.setItem("adminLogin", "true");

        // Tutup popup
        closePopup();

        // Masuk ke halaman admin
        window.location.href = "admin.html";

      } else {

        alert("Username atau password salah!");

      }

    } catch (err) {
      console.error("Login Error:", err);
      alert("Terjadi error saat login, coba lagi.");
    }
  });
</script>
</body>
</html>
