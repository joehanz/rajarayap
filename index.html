  <!-- POPUP LOGIN -->
<div id="loginPopup" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
  <div class="bg-gray-800 rounded-lg shadow-lg p-6 w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login Admin</h2>
    <form id="loginForm" class="space-y-4">
      <!-- Email / Telpon -->
      <input type="text" id="username" name="username" placeholder="Email / Telpon"
             class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" required>
      <!-- Password -->
      <input type="password" id="password" name="password" placeholder="Password"
             class="w-full px-3 py-2 rounded bg-gray-700 text-white focus:outline-none" required>
      <!-- Tombol -->
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded font-semibold">
        Login
      </button>
      <button type="button" onclick="closePopup()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded font-semibold">
        Batal
      </button>
    </form>
  </div>
</div>

<script>
  function openPopup() {
    document.getElementById("loginPopup").classList.remove("hidden");
    document.getElementById("loginPopup").classList.add("flex");
  }

  function closePopup() {
    document.getElementById("loginPopup").classList.add("hidden");
    document.getElementById("loginPopup").classList.remove("flex");
  }

  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    try {
      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);

      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbzapZ2eOZ6js8EUxyaTgphq0EnVS7Yw66-aW30yuuDwG4bYQhQWJCHzLpTXkUOch1VN/exec",
        {
          method: "POST",
          body: formData
        }
      );

      const result = await response.json();

      console.log("Login Result:", result);

      if (result.success === true) {

        // Simpan session login
        sessionStorage.setItem("adminLogin", "true");

        // Tutup popup
        closePopup();

        // Masuk ke halaman admin
        window.location.href = "admin.html";

      } else {

        alert("Username atau password salah!");

      }

    } catch (err) {
      console.error("Login Error:", err);
      alert("Terjadi error saat login, coba lagi.");
    }
  });
</script>
